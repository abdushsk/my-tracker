<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A"/>
      <stop offset="100%" style="stop-color:#43A047"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circle background with gradient -->
  <circle cx="64" cy="64" r="58" fill="url(#bgGradient)" filter="url(#shadow)"/>

  <!-- Outer target ring -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="white" stroke-width="3" opacity="0.25"/>

  <!-- Inner target ring -->
  <circle cx="64" cy="64" r="32" fill="none" stroke="white" stroke-width="2" opacity="0.2"/>

  <!-- Checkmark -->
  <path d="M38 64L56 82L90 46" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>