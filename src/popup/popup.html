<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tracker</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div id="app">
    <!-- Loading Skeleton (shown immediately) -->
    <div id="loading-skeleton" class="loading-skeleton">
      <div class="skeleton-header">
        <div class="skeleton-title"></div>
        <div class="skeleton-subtitle"></div>
      </div>
      <div class="skeleton-goals">
        <div class="skeleton-goal-card">
          <div class="skeleton-goal-icon"></div>
          <div class="skeleton-goal-content">
            <div class="skeleton-goal-name"></div>
            <div class="skeleton-goal-progress"></div>
          </div>
        </div>
        <div class="skeleton-goal-card">
          <div class="skeleton-goal-icon"></div>
          <div class="skeleton-goal-content">
            <div class="skeleton-goal-name"></div>
            <div class="skeleton-goal-progress"></div>
          </div>
        </div>
        <div class="skeleton-goal-card">
          <div class="skeleton-goal-icon"></div>
          <div class="skeleton-goal-content">
            <div class="skeleton-goal-name"></div>
            <div class="skeleton-goal-progress"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- View Goals Screen (default) -->
    <div id="screen-view-goals" class="screen">
      <!-- Header, goals list, and footer will be rendered here -->
    </div>

    <!-- Manage Goals Screen -->
    <div id="screen-manage-goals" class="screen">
      <!-- Goal management UI will be rendered here -->
    </div>

    <!-- Reports Screen -->
    <div id="screen-reports" class="screen">
      <!-- Reports and analytics will be rendered here -->
    </div>

    <!-- Settings Screen -->
    <div id="screen-settings" class="screen">
      <!-- Settings UI will be rendered here -->
    </div>

    <!-- US-058: Goal Form Screen (Full-Page Add/Edit) -->
    <div id="screen-goal-form" class="screen">
      <!-- Goal form UI will be rendered here -->
    </div>

    <!-- US-067: Focus Mode Screen -->
    <div id="screen-focus-mode" class="screen">
      <!-- Focus mode UI will be rendered here -->
    </div>

    <!-- US-069: Archive Screen -->
    <div id="screen-archive" class="screen">
      <!-- Archive UI will be rendered here -->
    </div>

    <!-- US-071: Goal Statistics Screen -->
    <div id="screen-goal-statistics" class="screen">
      <!-- Goal Statistics UI will be rendered here -->
    </div>

    <!-- US-072: Weekly Review Screen -->
    <div id="screen-weekly-review" class="screen">
      <!-- Weekly Review UI will be rendered here -->
    </div>

    <!-- US-080: Achievements Screen -->
    <div id="screen-achievements" class="screen">
      <!-- Achievements UI will be rendered here -->
    </div>

    <!-- Persistent Bottom Navigation -->
    <nav id="main-nav" class="main-bottom-nav">
      <button class="nav-btn active" data-screen="viewGoals">
        <span class="nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </span>
        <span class="nav-label">Goals</span>
      </button>
      <button class="nav-btn" data-screen="reports">
        <span class="nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
        </span>
        <span class="nav-label">Reports</span>
      </button>
      <button class="nav-btn" data-screen="settings">
        <span class="nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </span>
        <span class="nav-label">Settings</span>
      </button>
    </nav>

    <!-- US-030: Delete Confirmation Dialog -->
    <div id="delete-confirm-modal" class="modal confirm-modal" aria-hidden="true">
      <div class="modal-overlay" data-action="close-delete-modal"></div>
      <div class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="delete-modal-title" aria-describedby="delete-modal-message">
        <div class="confirm-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>
        <h3 id="delete-modal-title" class="confirm-title">Delete this goal?</h3>
        <p id="delete-modal-message" class="confirm-message">This cannot be undone. All progress and history for this goal will be permanently deleted.</p>
        <div class="confirm-actions">
          <button type="button" class="btn btn-secondary" data-action="close-delete-modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirm-delete-btn" data-action="confirm-delete">Delete</button>
        </div>
      </div>
    </div>

    <!-- US-058: Goal Form Modal removed - replaced with full-page SCREENS.GOAL_FORM -->
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
