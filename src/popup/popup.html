<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Goals Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- View Goals Screen (default) -->
    <div id="screen-view-goals" class="screen active">
      <!-- Header, goals list, and footer will be rendered here -->
    </div>

    <!-- Manage Goals Screen -->
    <div id="screen-manage-goals" class="screen">
      <!-- Goal management UI will be rendered here -->
    </div>

    <!-- Reports Screen -->
    <div id="screen-reports" class="screen">
      <!-- Reports and analytics will be rendered here -->
    </div>

    <!-- Settings Screen -->
    <div id="screen-settings" class="screen">
      <!-- Settings UI will be rendered here -->
    </div>

    <!-- US-022: Goal Form Modal -->
    <div id="goal-form-modal" class="modal" aria-hidden="true">
      <div class="modal-overlay" data-action="close-modal"></div>
      <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <h2 id="modal-title" class="modal-title">Add New Goal</h2>
          <button class="modal-close-btn" data-action="close-modal" title="Close" aria-label="Close modal">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <form id="goal-form" class="goal-form" novalidate>
            <!-- US-023: Title Input -->
            <div class="form-group">
              <label for="goal-title" class="form-label">Goal Title <span class="required-indicator">*</span></label>
              <input
                type="text"
                id="goal-title"
                name="title"
                class="form-input"
                placeholder="e.g., Study for exam"
                required
                maxlength="100"
                autocomplete="off"
              >
              <span class="form-error" id="goal-title-error" role="alert" aria-live="polite"></span>
            </div>

            <!-- US-024: Type Selector -->
            <div class="form-group">
              <label class="form-label">Goal Type <span class="required-indicator">*</span></label>
              <div class="type-selector" role="radiogroup" aria-label="Select goal type">
                <button type="button" class="type-option active" data-type="timer" role="radio" aria-checked="true" title="Timer - Track time spent on a goal">
                  <span class="type-option-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="12" r="10"/>
                      <polyline points="12 6 12 12 16 14"/>
                    </svg>
                  </span>
                  <span class="type-option-label">Timer</span>
                </button>
                <button type="button" class="type-option" data-type="counter" role="radio" aria-checked="false" title="Counter - Track a count towards a target">
                  <span class="type-option-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <line x1="12" y1="1" x2="12" y2="23"/>
                      <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                    </svg>
                  </span>
                  <span class="type-option-label">Counter</span>
                </button>
                <button type="button" class="type-option" data-type="checkbox" role="radio" aria-checked="false" title="Checkbox - Simple yes/no completion">
                  <span class="type-option-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                      <polyline points="9 11 12 14 22 4"/>
                    </svg>
                  </span>
                  <span class="type-option-label">Checkbox</span>
                </button>
              </div>
              <input type="hidden" id="goal-type" name="type" value="timer">
            </div>

            <!-- US-025: Timer Target Input -->
            <div class="form-group target-input-group" id="timer-target-group">
              <label for="timer-target-hours" class="form-label">Target Time <span class="required-indicator">*</span></label>
              <div class="timer-target-inputs">
                <div class="time-input-field">
                  <input
                    type="number"
                    id="timer-target-hours"
                    name="timer-hours"
                    class="form-input time-input"
                    placeholder="0"
                    min="0"
                    max="23"
                    value="1"
                    autocomplete="off"
                  >
                  <span class="time-input-label">hours</span>
                </div>
                <span class="time-separator">:</span>
                <div class="time-input-field">
                  <input
                    type="number"
                    id="timer-target-minutes"
                    name="timer-minutes"
                    class="form-input time-input"
                    placeholder="0"
                    min="0"
                    max="59"
                    value="0"
                    autocomplete="off"
                  >
                  <span class="time-input-label">minutes</span>
                </div>
              </div>
              <span class="form-error" id="timer-target-error" role="alert" aria-live="polite"></span>
              <p class="form-hint">Set the duration you want to track (e.g., 1 hour 30 minutes)</p>
            </div>

            <!-- US-026: Counter Target Input -->
            <div class="form-group target-input-group hidden" id="counter-target-group">
              <label for="counter-target" class="form-label">Target Count <span class="required-indicator">*</span></label>
              <input
                type="number"
                id="counter-target"
                name="counter-target"
                class="form-input counter-target-input"
                placeholder="e.g., 10"
                min="1"
                value="10"
                autocomplete="off"
              >
              <span class="form-error" id="counter-target-error" role="alert" aria-live="polite"></span>
              <p class="form-hint">Set the target count you want to reach (minimum 1)</p>
            </div>

            <!-- Timeframe selector will be added in US-027 -->
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button>
          <button type="submit" form="goal-form" class="btn btn-primary">Save Goal</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
